name: APK 빌드 · 릴리스 · 웹 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  android:
    name: 안드로이드 APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: 버전 읽기
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 패키지 설치
        run: npm install --no-audit --no-fund

      - name: 웹 빌드 준비 (버전 · 엑셀 라이브러리)
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/build-www.mjs

      - name: 안드로이드 프로젝트 생성
        run: |
          npx cap add android
          npx cap sync android

      - name: 아이콘 · 스플래시 생성
        run: npx @capacitor/assets generate --android --assetPath resources --iconBackgroundColor '#1F4E8C' --iconBackgroundColorDark '#1F4E8C' --splashBackgroundColor '#1F4E8C' --splashBackgroundColorDark '#1F4E8C'

      - name: 서명키 준비 (비밀값 있으면 그걸, 없으면 저장소의 키)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android-signing/release.jks
            echo "비밀값 키스토어 사용"
          else
            echo "저장소 키스토어 사용"
          fi

      - name: 버전코드 · 서명 설정
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ github.workspace }}/android-signing/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'daejeon-rental-2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ledger' }}
        run: node scripts/prepare-android.mjs

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: APK 이름 정리
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/daejeon-ledger-v${{ steps.ver.outputs.version }}.apk"
          ls -la dist

      - name: 릴리스 설명 만들기
        run: node scripts/release-notes.mjs > dist/notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: apk-v${{ steps.ver.outputs.version }}
          path: dist/*.apk

      - name: 깃허브 릴리스 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: 석재 가계부 v${{ steps.ver.outputs.version }}
          body_path: dist/notes.md
          files: dist/*.apk
          make_latest: true

  pages:
    name: 웹 버전 (PC용) 배포
    runs-on: ubuntu-latest
    needs: android
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/build-www.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
